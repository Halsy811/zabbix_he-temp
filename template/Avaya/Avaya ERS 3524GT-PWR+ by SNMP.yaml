      tags:
        - tag: class
          value: network
        - tag: target
          value: avaya-ers
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'CPU utilization percent for High trigger.'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
