zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: e832653588c444938bf1f30ed8d470ad
      template: 'Avaya ERS 3524GT by SNMP'
      name: 'Avaya ERS 3524GT-PWR+ by SNMP'
      description: |
        Custom template for Avaya (Nortel) Ethernet Routing Switch 3524GT-PWR+ (BayStack 3500 family), sysObjectID .1.3.6.1.4.1.45.3.80.4, firmware 5.3.x.
        Verified by SNMP walk: IF-MIB with 64-bit HC counters (physical ports ifType=6 only; VLAN sub-interfaces 135/136 have no counters and are excluded), EtherLike-MIB dot3Stats (duplex), ENTITY-MIB (model/serial/hw/fw/sw), LLDP-MIB lldpRemTable (neighbors), RAPID-CITY MIB (CPU rcSysCpuUtil5sAvg/1mAvg, VLAN rcVlanTable).
        No fan/PSU/temperature sensors on fw 5.x (rcChas subtree absent) - none invented. POWER-ETHERNET-MIB (.105) answers but deviates from RFC 3621 column semantics - not monitored.
        Chassis serial is taken from entPhysicalSerialNum (rcChasSerialNum is empty on this family).
        Host side: set {$IFCONTROL}=0 for access switches with unused ports (silences Link down on free ports).
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: e55d4a0ff3114a94b7c5f6f2f52e63a3
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 90d
          trends: 200d
          description: 'Host accessibility by ICMP ping. 0 - fails, 1 - successful.'
          valuemap:
            name: 'ICMP status'
          triggers:
            - uuid: 7ea10f91864844d68d5d4182198a9cdb
              expression: 'max(/Avaya ERS 3524GT by SNMP/icmpping,#3)=0'
              name: 'Avaya ERS 3524GT by SNMP: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Check device connectivity.'
        - uuid: 1d3d518b257d4928b71fb98ef7ae5df2
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 90d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 733419ebee3849998fc4a4c577e8c3d8
              expression: 'min(/Avaya ERS 3524GT by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Avaya ERS 3524GT by SNMP/icmppingloss,5m)<100'
              name: 'Avaya ERS 3524GT by SNMP: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packet loss detected.'
              dependencies:
                - name: 'Avaya ERS 3524GT by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3524GT by SNMP/icmpping,#3)=0'
        - uuid: 0499a45f17a1456eb0196cd3d20bda95
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 90d
          value_type: FLOAT
          units: s
          triggers:
            - uuid: a101760c1ad947a68c4b11a37ba7665a
              expression: 'avg(/Avaya ERS 3524GT by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Avaya ERS 3524GT by SNMP: High ICMP ping response time'
              opdata: 'Time: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Avaya ERS 3524GT by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3524GT by SNMP/icmpping,#3)=0'
        - uuid: 3356893139494c099128cb7dd75e584a
          name: 'System contact'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.4.0
          key: system.contact
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
        - uuid: 0894bea6bbc8476c9faa08d079d9c288
          name: 'CPU utilization (1m average)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2272.1.34.3.2.0
          key: system.cpu.util.1m
          delay: 3m
          history: 90d
          trends: 200d
          units: '%'
          description: 'RADLAN rcSysCpuUtil1mAvg - CPU utilization averaged over 1 minute.'
        - uuid: 69c908cabb6f481d8ebdfaa977c0b67c
          name: 'CPU utilization (5s average)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2272.1.34.1.2.0
          key: system.cpu.util.5s
          delay: 3m
          history: 90d
          trends: 200d
          units: '%'
          description: 'RADLAN rcSysCpuUtil5sAvg - CPU utilization averaged over 5 seconds.'
          triggers:
            - uuid: becc0e77a38843688324658ef8cff91d
              expression: 'avg(/Avaya ERS 3524GT by SNMP/system.cpu.util.5s,5m)>{$CPU.UTIL.CRIT}'
              name: 'Avaya ERS 3524GT by SNMP: High CPU utilization'
              opdata: 'Load: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization exceeds {$CPU.UTIL.CRIT}%% for 5 minutes.'
        - uuid: 92316618351d497382a00c88692ac8b1
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Contains HW/FW/SW revision: "Ethernet Routing Switch 3524GT-PWR+ HW:17 FW:5.3.0.6 SW:v5.3.3.015".'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
        - uuid: 0c064beba0de4e37995d26f1416f7481
          name: 'Hardware serial number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.47.1.1.1.1.11.2
          key: system.hw.serial
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Chassis serial number from ENTITY-MIB (rcChasSerialNum is empty on ERS 3500/4800 fw 5.x).'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          triggers:
            - uuid: 7a233b31cc4e4f1588f403e294484656
              expression: 'last(/Avaya ERS 3524GT by SNMP/system.hw.serial)<>last(/Avaya ERS 3524GT by SNMP/system.hw.serial,#2) and length(last(/Avaya ERS 3524GT by SNMP/system.hw.serial))>0'
              name: 'Avaya ERS 3524GT by SNMP: Device has been replaced'
              priority: INFO
              description: 'New serial number received: {ITEM.VALUE}'
              manual_close: 'YES'
        - uuid: da64e47f55c348b0946f18d1ff7ce017
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.6.0
          key: system.location
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
        - uuid: d2a65347eaa042688cbd1d0cbf17eb78
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 15m
          history: 30d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          triggers:
            - uuid: 661127c6863f488cb3bccacaf27b1dce
              expression: 'last(/Avaya ERS 3524GT by SNMP/system.name)<>last(/Avaya ERS 3524GT by SNMP/system.name,#2) and length(last(/Avaya ERS 3524GT by SNMP/system.name))>0'
              name: 'Avaya ERS 3524GT by SNMP: System name has changed'
              priority: INFO
              description: 'New name: {ITEM.VALUE}'
              manual_close: 'YES'
        - uuid: 775cc2e93d5041e6ac6c02bd87d39372
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.2.0
          key: system.objectid
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
        - uuid: 72be283da6b444e1b88f994761237c92
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 3m
          history: 30d
          trends: 200d
          units: s
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          triggers:
            - uuid: 5f51d60cc9b54c9f9b9a4ee3d20f5086
              expression: 'last(/Avaya ERS 3524GT by SNMP/system.uptime)<600'
              name: 'Avaya ERS 3524GT by SNMP: Device has been restarted (uptime < 10 min)'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'sysUpTime is less than 10 minutes.'
              manual_close: 'YES'
        - uuid: 3ccdef7d793749a0b676337733d07477
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 90d
          trends: 200d
          description: 'Availability of SNMP checks on the host.'
          valuemap:
            name: 'SNMP agent availability'
          triggers:
            - uuid: 7d6d062fd5d54c97ba08d2abc2f061e3
              expression: 'max(/Avaya ERS 3524GT by SNMP/zabbix[host,snmp,available],10m)=2'
              name: 'Avaya ERS 3524GT by SNMP: No SNMP data collection'
              priority: WARNING
              description: 'SNMP check errors for 10 minutes. Check interface, community and ACL on the device.'
              manual_close: 'YES'
              dependencies:
                - name: 'Avaya ERS 3524GT by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3524GT by SNMP/icmpping,#3)=0'
      discovery_rules:
        - uuid: 66fce27a4aca4c8dbb190a0dbcaaf956
          name: 'Entity Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENT_CLASS},.1.3.6.1.2.1.47.1.1.1.1.5,{#ENT_NAME},.1.3.6.1.2.1.47.1.1.1.1.7]'
          key: entity.physical.discovery
          delay: 1h
          lifetime: 30d
          description: 'Discovers ENTITY-MIB entities: chassis (serial!) and 50 ports.'
          item_prototypes:
            - uuid: afd09f715ce44d19b9c76d5544996852
              name: '{#ENT_NAME}: Class'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.5.{#SNMPINDEX}'
              key: 'entity.class[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              trends: 200d
              valuemap:
                name: 'Entity class'
            - uuid: 5b1b9dd9355344aebe6d11a8ba3220f0
              name: '{#ENT_NAME}: Field replaceable'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.16.{#SNMPINDEX}'
              key: 'entity.fru[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              trends: 200d
              valuemap:
                name: Boolean
            - uuid: 8cc29559153144d490294dfb88d94be8
              name: '{#ENT_NAME}: Firmware version'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.9.{#SNMPINDEX}'
              key: 'entity.fwrev[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
            - uuid: 7d85511cb40d47ea862bfa97ae3b2e96
              name: '{#ENT_NAME}: Hardware version(revision)'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.8.{#SNMPINDEX}'
              key: 'entity.hwrev[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: entPhysicalHardwareRev.
            - uuid: 43ede24674de42f8aa892f6101cb64f4
              name: '{#ENT_NAME}: Manufacturer'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.12.{#SNMPINDEX}'
              key: 'entity.mfg[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
            - uuid: a3511af6ff6c4f11957056dce828986e
              name: '{#ENT_NAME}: Hardware model name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'entity.model[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: entPhysicalDescr.
            - uuid: 4c843e0c80ac48e0a57604c1e4d251de
              name: '{#ENT_NAME}: Hardware serial number'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'entity.serial[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'entPhysicalSerialNum; filled for chassis.'
            - uuid: b550d6b8f47f4fbba989058b5c3531f4
              name: '{#ENT_NAME}: Software version'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.10.{#SNMPINDEX}'
              key: 'entity.swrev[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
        - uuid: 68e493c7971b4f8b9c6ceeefaa95bddf
          name: 'LLDP neighbors discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#LLDP_SYSNAME},.1.0.8802.1.1.2.1.4.1.1.9,{#LLDP_PORTDESC},.1.0.8802.1.1.2.1.4.1.1.8,{#LLDP_CHASSISID},.1.0.8802.1.1.2.1.4.1.1.7]'
          key: lldp.rem.discovery
          delay: 1h
          lifetime: 1h
          description: 'LLDP-MIB lldpRemTable. Rows are volatile (index = TimeMark.LocalPortNum.RemIndex), so lost rows are removed after 1h. Verified on fw 5.3.x.'
          item_prototypes:
            - uuid: ad60dbdf02e04e7ea9b65f329eedb3ee
              name: 'Interface {#SNMPINDEX}: LLDP remote chassis ID'
              type: SNMP_AGENT
              snmp_oid: '.1.0.8802.1.1.2.1.4.1.1.7.{#SNMPINDEX}'
              key: 'lldp.rem.chassisid[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'lldpRemChassisId (MAC for most neighbors).'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
            - uuid: 2170f75c5ce9465983c35d1f5d085281
              name: 'Interface {#SNMPINDEX}: LLDP remote port description'
              type: SNMP_AGENT
              snmp_oid: '.1.0.8802.1.1.2.1.4.1.1.8.{#SNMPINDEX}'
              key: 'lldp.rem.portdesc[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'lldpRemPortDesc (may be empty for some neighbors).'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
            - uuid: 8cda9dcb559d40dfb9d0c06313bc1ee1
              name: 'Interface {#SNMPINDEX}: LLDP remote system name'
              type: SNMP_AGENT
              snmp_oid: '.1.0.8802.1.1.2.1.4.1.1.9.{#SNMPINDEX}'
              key: 'lldp.rem.sysname[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'lldpRemSysName of the neighbor seen on this port.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
        - uuid: 1a8ff3928ca8484eb9bcdc8077a2c01f
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},.1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},.1.3.6.1.2.1.2.2.1.7,{#IFALIAS},.1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},.1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},.1.3.6.1.2.1.2.2.1.2,{#IFTYPE},.1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFTYPE}'
                value: ^6$
                formulaid: E
          lifetime: 30d
          description: 'Discovers physical ports (ifType=6, 48 x 10/100/1000 + SFP combo). Counters from RFC1213 ifTable and 64-bit ifXTable.'
          item_prototypes:
            - uuid: 7efef6a3b5254ed3a00babe50fb98d59
              name: 'Interface {#IFNAME}({#IFALIAS}): Administrative status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.admin[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              valuemap:
                name: 'IF administrative status'
            - uuid: 18ed9b461f8c4fc9bee720f7c168b47d
              name: 'Interface {#IFNAME}({#IFALIAS}): Duplex status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.10.7.2.1.19.{#SNMPINDEX}'
              key: 'net.if.duplex[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              description: 'dot3StatsDuplexStatus: 1=unknown, 2=halfDuplex, 3=fullDuplex.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
            - uuid: 149ea08e9f2f4ab09585ad475d217c3e
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in.bytes[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: dc3d520613bf4816a2e43b4d3296df1d
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: 803c312cea604b2c93726d05bce39e97
                  expression: 'min(/Avaya ERS 3524GT by SNMP/net.if.in.discards[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound discards'
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} discards per second for 5 minutes.'
            - uuid: 8e181034349e4d759d44786587da41b0
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: 2a31731e8fac4d86aaf94d45176845f5
                  expression: 'min(/Avaya ERS 3524GT by SNMP/net.if.in.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate'
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} errors per second for 5 minutes.'
            - uuid: 1f5e74d1954e47de808d724a68922bdd
              name: 'Interface {#IFNAME}({#IFALIAS}): Packets received'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.11.{#SNMPINDEX}'
              key: 'net.if.in.packets[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
            - uuid: 73dfe8965edf4a8fb26df024f940588c
              name: 'Interface {#IFNAME}({#IFALIAS}): MAC address'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.6.{#SNMPINDEX}'
              key: 'net.if.mac[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              value_type: CHAR
              trends: '0'
            - uuid: 655f1bb8b5b14406a4e68ff092076c6c
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out.bytes[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: 7ab408f12c9d47c295818b4edec84390
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: 64b355f6ec164fc9883f96a20ff54f63
                  expression: 'min(/Avaya ERS 3524GT by SNMP/net.if.out.discards[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High outbound discards'
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} discards per second for 5 minutes.'
            - uuid: 7624c0b0fef8440787d19f1ea49f8830
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: db252eaa851a43baa455a293c859609d
                  expression: 'min(/Avaya ERS 3524GT by SNMP/net.if.out.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High outbound error rate'
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} errors per second for 5 minutes.'
            - uuid: 7dd0ca8594504d9c8efc9c4666eaacea
              name: 'Interface {#IFNAME}({#IFALIAS}): Packets sent'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.17.{#SNMPINDEX}'
              key: 'net.if.out.packets[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
            - uuid: b548157d227f45588f695650d1e1f0c7
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: bps
              description: 'ifHighSpeed in Mbps, converted to bps.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
            - uuid: dd43aae247be46d8b22831ad95923740
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              valuemap:
                name: 'IF operational status'
            - uuid: c1e9dfb932fd4df38ea46f1e0f3fe96e
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
              key: 'net.if.type[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              description: 'ifType of the interface (6 = ethernetCsmacd; only 6 passes the LLD filter).'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
          trigger_prototypes:
            - uuid: d42f42a353b94320a9ca1df6ccdac400
              expression: |
                change(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])<0 and last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])>0
                and (
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=6 or
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=7 or
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=11 or
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=62 or
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=69 or
                last(/Avaya ERS 3524GT by SNMP/net.if.type[{#SNMPINDEX}])=117
                )
                and
                (last(/Avaya ERS 3524GT by SNMP/net.if.status[{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])>0 and last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}],#2)>0) or
                (last(/Avaya ERS 3524GT by SNMP/net.if.status[{#SNMPINDEX}])=2)
              name: 'Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 2b4ac146e2d8443189aa2fdad6856b1d
              expression: |
                (avg(/Avaya ERS 3524GT by SNMP/net.if.in.bytes[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}]) or
                avg(/Avaya ERS 3524GT by SNMP/net.if.out.bytes[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])) and
                last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Avaya ERS 3524GT by SNMP/net.if.in.bytes[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}]) and
                avg(/Avaya ERS 3524GT by SNMP/net.if.out.bytes[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Avaya ERS 3524GT by SNMP/net.if.speed[{#SNMPINDEX}])
              name: 'Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'Avaya ERS 3524GT: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 4701f4b43e95498cb61c0ed834cd36c5
              expression: '{$IFCONTROL}=1 and last(/Avaya ERS 3524GT by SNMP/net.if.status[{#SNMPINDEX}])=2 and last(/Avaya ERS 3524GT by SNMP/net.if.admin[{#SNMPINDEX}])=1'
              name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
              priority: AVERAGE
              description: 'Interface is down while administratively up.'
          graph_prototypes:
            - uuid: fb6a1a5b452445e9803873cdec7bfc09
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.in.bytes[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.out.bytes[{#SNMPINDEX}]'
                - sortorder: '2'
                  drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.out.errors[{#SNMPINDEX}]'
                - sortorder: '4'
                  drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.in.errors[{#SNMPINDEX}]'
                - sortorder: '6'
                  drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.out.discards[{#SNMPINDEX}]'
                - sortorder: '8'
                  drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3524GT by SNMP'
                    key: 'net.if.in.discards[{#SNMPINDEX}]'
        - uuid: 95365a4dd05445e486d5f4790fc50487
          name: 'VLAN Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VLANNAME},.1.3.6.1.4.1.2272.1.3.2.1.2]'
          key: vlan.discovery
          delay: 1h
          lifetime: 30d
