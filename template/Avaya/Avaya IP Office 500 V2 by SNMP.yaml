              value: network
        - uuid: 7604a381a16d48cab35eec3e8a6bfd36
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 90d
          trends: 200d
          description: 'Host accessibility by ICMP ping. 0 - fails, 1 - successful.'
          valuemap:
            name: 'ICMP status'
          triggers:
            - uuid: 1419e12e4bc3478bac9654eca63fbef9
              expression: 'max(/Avaya IP Office 500 V2 by SNMP/icmpping,#3)=0'
              name: 'Avaya IP Office 500 V2 by SNMP: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Check device connectivity.'
        - uuid: 6357bf153c634718a9d9228bec2f026b
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 90d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 12d4c0759e87494297b6e73cc88f75c3
              expression: 'min(/Avaya IP Office 500 V2 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Avaya IP Office 500 V2 by SNMP/icmppingloss,5m)<100'
              name: 'Avaya IP Office 500 V2 by SNMP: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packet loss detected.'
              dependencies:
                - name: 'Avaya IP Office 500 V2 by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya IP Office 500 V2 by SNMP/icmpping,#3)=0'
        - uuid: d1ebba13b413445195763aa5bbdd9531
