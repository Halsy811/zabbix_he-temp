      discovery_rules:
        - uuid: b59ede58eb584984968956e927f8760d
          name: 'Physical entities discovery (ENTITY-MIB)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENTDESCR},.1.3.6.1.2.1.47.1.1.1.1.2,{#ENTCLASS},.1.3.6.1.2.1.47.1.1.1.1.5,{#ENTNAME},.1.3.6.1.2.1.47.1.1.1.1.7,{#ENTFRU},.1.3.6.1.2.1.47.1.1.1.1.16]'
          key: entity.physical.discovery
          delay: 1h
          lifetime: 30d
          description: 'Discovers chassis/slots/cards/ports via ENTITY-MIB entPhysicalTable (55 entities on IP500V2).'
          item_prototypes:
            - uuid: c2076d6f673b4243810e658eb64b1e77
              name: 'Entity {#SNMPINDEX}: Class'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.5.{#SNMPINDEX}'
              key: 'entity.class[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              trends: 200d
