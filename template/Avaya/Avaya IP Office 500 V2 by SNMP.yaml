              name: 'Avaya IP Office 500 V2 by SNMP: High ICMP ping response time'
              opdata: 'Time: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Avaya IP Office 500 V2 by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya IP Office 500 V2 by SNMP/icmpping,#3)=0'
