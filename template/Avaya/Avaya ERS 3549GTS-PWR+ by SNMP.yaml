zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 66a61daabfe844389df733788723b7d9
      template: 'Avaya ERS 3549GTS by SNMP'
      name: 'Avaya ERS 3549GTS-PWR+ by SNMP'
      description: 'Custom template for Avaya (Nortel) Ethernet Routing Switch 3549GTS-PWR+ (48x 10/100/1000 PoE + 4 SFP), sysObjectID .1.3.6.1.4.1.45.3.80.8, firmware 5.3.x (FASTPATH-based). Cloned from "Avaya ERS 3526T-PWR+ by SNMP". Monitors: ICMP reachability, SNMP availability, system, RADLAN rcSys CPU (5s/1m avg), chassis serial, ifTable+ifXTable per-port traffic/errors/discards with utilization triggers, ENTITY-MIB inventory (chassis serial 15JP*), rcVlanTable VLAN names. SNMPv2c.'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 26c85ee476fa4119900e270135c3868f
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 90d
          trends: 200d
          description: 'Host accessibility by ICMP ping. 0 - fails, 1 - successful.'
          valuemap:
            name: 'ICMP status'
          triggers:
            - uuid: d34518961e904dcca539c64562b46fb5
              expression: 'max(/Avaya ERS 3549GTS by SNMP/icmpping,#3)=0'
              name: 'Avaya ERS 3549GTS by SNMP: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Check device connectivity.'
        - uuid: c0bda9aab1b1469d89bf2805116cd6c8
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 90d
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: 4921b1c08e13437cb14745ae5d7fa66a
              expression: 'min(/Avaya ERS 3549GTS by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Avaya ERS 3549GTS by SNMP/icmppingloss,5m)<100'
              name: 'Avaya ERS 3549GTS by SNMP: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packet loss detected.'
              dependencies:
                - name: 'Avaya ERS 3549GTS by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3549GTS by SNMP/icmpping,#3)=0'
        - uuid: 3a387cb894054613b5795dc4c99fca2d
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 90d
          value_type: FLOAT
          units: s
          triggers:
            - uuid: b4bde744b1e64cfda6d394c70b6fd2b3
              expression: 'avg(/Avaya ERS 3549GTS by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Avaya ERS 3549GTS by SNMP: High ICMP ping response time'
              opdata: 'Time: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Avaya ERS 3549GTS by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3549GTS by SNMP/icmpping,#3)=0'
        - uuid: 95f4a1f01c5940e0825d7fe6e05a586f
          name: 'System contact'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.4.0
          key: system.contact
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
        - uuid: 8297d8dd9156451797b18cb3e8b75558
          name: 'CPU utilization (1m average)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2272.1.34.3.2.0
          key: system.cpu.util.1m
          delay: 3m
          history: 90d
          trends: 200d
          units: '%'
          description: 'RADLAN rcSysCpuUtil1mAvg - CPU utilization averaged over 1 minute.'
        - uuid: 26086e87cf1745349ab2ef7b14c6f7fc
          name: 'CPU utilization (5s average)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2272.1.34.1.2.0
          key: system.cpu.util.5s
          delay: 3m
          history: 90d
          trends: 200d
          units: '%'
          description: 'RADLAN rcSysCpuUtil5sAvg - CPU utilization averaged over 5 seconds.'
          triggers:
            - uuid: 6a8a7a69ef544e0a8920f46ed532dc50
              expression: 'avg(/Avaya ERS 3549GTS by SNMP/system.cpu.util.5s,5m)>{$CPU.UTIL.CRIT}'
              name: 'Avaya ERS 3549GTS by SNMP: High CPU utilization'
              opdata: 'Load: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization exceeds {$CPU.UTIL.CRIT}%% for 5 minutes.'
        - uuid: bde35573ff7c4f0c924c4bae5717062f
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Contains HW/FW/SW revision: "Ethernet Routing Switch 3549GTS-PWR+ HW:03 FW:1.0.0.15 SW:v5.3.3.015".'
        - uuid: 0a8e754ab8a946b5b5ed503183db0ec3
          name: 'Hardware serial number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2272.1.2.2.0
          key: system.hw.serial
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'rcChasSerialNum. Empty on this unit unless configured; chassis serial also available via Entity discovery.'
          triggers:
            - uuid: e0903a27944749d2b02f2ba19e4ce743
              expression: 'last(/Avaya ERS 3549GTS by SNMP/system.hw.serial)<>last(/Avaya ERS 3549GTS by SNMP/system.hw.serial,#2) and length(last(/Avaya ERS 3549GTS by SNMP/system.hw.serial))>0'
              name: 'Avaya ERS 3549GTS by SNMP: Device has been replaced'
              priority: INFO
              description: 'New serial number received: {ITEM.VALUE}'
              manual_close: 'YES'
        - uuid: 5b197daee88241c7a13067508181cbed
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.6.0
          key: system.location
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
        - uuid: 00f9bcb6a09d48c185e36a2bb29c8fdd
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 15m
          history: 30d
          value_type: CHAR
          trends: '0'
          triggers:
            - uuid: c1285b4bf5704bcd8b41c53d4c56dd9c
              expression: 'last(/Avaya ERS 3549GTS by SNMP/system.name)<>last(/Avaya ERS 3549GTS by SNMP/system.name,#2) and length(last(/Avaya ERS 3549GTS by SNMP/system.name))>0'
              name: 'Avaya ERS 3549GTS by SNMP: System name has changed'
              priority: INFO
              description: 'New name: {ITEM.VALUE}'
              manual_close: 'YES'
        - uuid: 231a2e5de9024aa7b8fb407a8e74e722
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.2.0
          key: system.objectid
          delay: 1h
          history: 30d
          value_type: CHAR
          trends: '0'
        - uuid: b0967801eebd44cd9cfe38683702bf29
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 3m
          history: 30d
          trends: 200d
          units: s
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          triggers:
            - uuid: bbbd4e4dfbdb4bc2a51bc6435ab1195f
              expression: 'last(/Avaya ERS 3549GTS by SNMP/system.uptime)<600'
              name: 'Avaya ERS 3549GTS by SNMP: Device has been restarted (uptime < 10 min)'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'sysUpTime is less than 10 minutes.'
              manual_close: 'YES'
        - uuid: 9ca0268472bf4b9780fe94f079a38aaf
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 90d
          trends: 200d
          description: 'Availability of SNMP checks on the host.'
          valuemap:
            name: 'SNMP agent availability'
          triggers:
            - uuid: 28d9f6d3f1bd47cd9bcaf2c0238d4cbe
              expression: 'max(/Avaya ERS 3549GTS by SNMP/zabbix[host,snmp,available],10m)=2'
              name: 'Avaya ERS 3549GTS by SNMP: No SNMP data collection'
              priority: WARNING
              description: 'SNMP check errors for 10 minutes. Check interface, community and ACL on the device.'
              manual_close: 'YES'
              dependencies:
                - name: 'Avaya ERS 3549GTS by SNMP: Unavailable by ICMP ping'
                  expression: 'max(/Avaya ERS 3549GTS by SNMP/icmpping,#3)=0'
      discovery_rules:
        - uuid: ca6b6405ebe34c82a6e33806059a8f39
          name: 'Entity Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENT_CLASS},.1.3.6.1.2.1.47.1.1.1.1.5,{#ENT_NAME},.1.3.6.1.2.1.47.1.1.1.1.7]'
          key: entity.physical.discovery
          delay: 1h
          lifetime: 30d
          description: 'Discovers ENTITY-MIB entities: chassis (serial!) and 52 ports.'
          item_prototypes:
            - uuid: d2623cfc5d044c5f831c201fbfb4e79e
              name: '{#ENT_NAME}: Class'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.5.{#SNMPINDEX}'
              key: 'entity.class[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              trends: 200d
              valuemap:
                name: 'Entity class'
            - uuid: 0b790e79fd584132a60ba021499f8293
              name: '{#ENT_NAME}: Field replaceable'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.16.{#SNMPINDEX}'
              key: 'entity.fru[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              trends: 200d
              valuemap:
                name: Boolean
            - uuid: cbfad9f86a274f8daeb51bc93c552a67
              name: '{#ENT_NAME}: Hardware version(revision)'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.8.{#SNMPINDEX}'
              key: 'entity.hwrev[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: entPhysicalHardwareRev.
            - uuid: c5fe03b369044e19b1d2bb4afbe9568e
              name: '{#ENT_NAME}: Manufacturer'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.12.{#SNMPINDEX}'
              key: 'entity.mfg[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
            - uuid: 1e1fb08206fc4cdea9e754f30f23acfa
              name: '{#ENT_NAME}: Hardware model name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'entity.model[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: entPhysicalDescr.
            - uuid: 2ea370c0c70a417785cc02f63c862873
              name: '{#ENT_NAME}: Hardware serial number'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'entity.serial[{#SNMPINDEX}]'
              delay: 6h
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'entPhysicalSerialNum; filled for chassis.'
        - uuid: b9b6be21eaea46529501cc3bd796eaa7
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},.1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},.1.3.6.1.2.1.2.2.1.7,{#IFALIAS},.1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},.1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},.1.3.6.1.2.1.2.2.1.2,{#IFTYPE},.1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
                formulaid: A
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: C
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#IFTYPE}'
                value: ^6$
                formulaid: E
          lifetime: 30d
          description: 'Discovers physical ports (ifType=6, 48x 10/100/1000 PoE + 4 SFP). Counters from RFC1213 ifTable and 64-bit ifXTable.'
          item_prototypes:
            - uuid: ec021806885749c98e65a30f024fff7f
              name: 'Interface {#IFNAME}({#IFALIAS}): Administrative status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.admin[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              valuemap:
                name: 'IF administrative status'
            - uuid: c18e43aa3fb541e6a6963620f2ecf5a7
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in.bytes[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: a2f1e17897244e669ed6a75e4598e170
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: a154e8cfaee04a2d896b528c3d8f7b29
                  expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.in.discards[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound discards'
                  status: DISABLED
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} discards per second for 5 minutes.'
            - uuid: 9d1994ec521a47728365dca9ff729097
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: a31b1e4efe764dcb913076e75026bc92
                  expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.in.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High inbound error rate'
                  status: DISABLED
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} errors per second for 5 minutes.'
            - uuid: 9f8aa0ca781b46b4ba9ef0664f104e4a
              name: 'Interface {#IFNAME}({#IFALIAS}): Packets received'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.11.{#SNMPINDEX}'
              key: 'net.if.in.packets[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
            - uuid: 79503cec06dc4bf1a443d1599a279682
              name: 'Interface {#IFNAME}({#IFALIAS}): MAC address'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.6.{#SNMPINDEX}'
              key: 'net.if.mac[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              value_type: CHAR
              trends: '0'
            - uuid: f2c0e1ba45854a7cab7ab74149e0e88c
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out.bytes[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
            - uuid: 8e85b10f82f247b7b221e447fb7442a1
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: 66d85a4a8c47419ab8fea3310f167ac7
                  expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.out.discards[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High outbound discards'
                  status: DISABLED
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} discards per second for 5 minutes.'
            - uuid: c82f2ec1c69e458ea5451d4c1a4efb97
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              trigger_prototypes:
                - uuid: c91b844d3c3349e18feaa72c603f80c7
                  expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.out.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN}'
                  name: 'Interface {#IFNAME}({#IFALIAS}): High outbound error rate'
                  status: DISABLED
                  priority: WARNING
                  description: 'More than {$IF.ERRORS.WARN} errors per second for 5 minutes.'
            - uuid: da01f35eb28149038c38343172c60686
              name: 'Interface {#IFNAME}({#IFALIAS}): Packets sent'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.17.{#SNMPINDEX}'
              key: 'net.if.out.packets[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
            - uuid: 78b04f8329994f969d568a3dc14a8b6b
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              units: bps
              description: 'ifHighSpeed in Mbps, converted to bps.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
            - uuid: f28c4d7d7a494cdcb70be07dc3c3b1a9
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              trends: 200d
              valuemap:
                name: 'IF operational status'
          trigger_prototypes:
            - uuid: fe17e35d27294f58856e154cba40bfc9
              expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.in.bytes[{#SNMPINDEX}],5m)>(last(/Avaya ERS 3549GTS by SNMP/net.if.speed[{#SNMPINDEX}])*({$IF.UTIL.MAX}/100))'
              name: 'Interface {#IFNAME}({#IFALIAS}): High inbound utilization'
              opdata: 'Util: {ITEM.LASTVALUE1}'
              status: DISABLED
              priority: WARNING
              description: 'Inbound traffic exceeds {$IF.UTIL.MAX}%% of bandwidth for 5 minutes.'
            - uuid: ad0fb67cf5504118a2df92f733b99519
              expression: 'min(/Avaya ERS 3549GTS by SNMP/net.if.out.bytes[{#SNMPINDEX}],5m)>(last(/Avaya ERS 3549GTS by SNMP/net.if.speed[{#SNMPINDEX}])*({$IF.UTIL.MAX}/100))'
              name: 'Interface {#IFNAME}({#IFALIAS}): High outbound utilization'
              opdata: 'Util: {ITEM.LASTVALUE1}'
              status: DISABLED
              priority: WARNING
              description: 'Outbound traffic exceeds {$IF.UTIL.MAX}%% of bandwidth for 5 minutes.'
            - uuid: c3a9eb32c42842b694fa51fd1f8da738
              expression: '{$IFCONTROL}=1 and last(/Avaya ERS 3549GTS by SNMP/net.if.status[{#SNMPINDEX}])=2 and last(/Avaya ERS 3549GTS by SNMP/net.if.admin[{#SNMPINDEX}])=1'
              name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
              status: DISABLED
              priority: AVERAGE
              description: 'Interface is down while administratively up.'
          graph_prototypes:
            - uuid: 5dac92729e434e608bd6a00864444d77
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: FILLED_REGION
                  color: 1A7C11
                  item:
                    host: 'Avaya ERS 3549GTS by SNMP'
                    key: 'net.if.in.bytes[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: 'Avaya ERS 3549GTS by SNMP'
                    key: 'net.if.out.bytes[{#SNMPINDEX}]'
        - uuid: 248a7645f7a34abb9537dc384d8c9273
          name: 'VLAN Discovery'
          type: SNMP_AGENT
