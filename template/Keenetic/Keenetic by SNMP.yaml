    - uuid: 89743590ba474e2ca3bad247d6cbee8d
      name: 'Load average'
      graph_items:
        - color: 1A7C11
          item:
            host: 'Keenetic by SNMP'
            key: la.load.1
        - sortorder: '1'
          color: 2774A4
          item:
            host: 'Keenetic by SNMP'
            key: la.load.5
        - sortorder: '2'
          color: F63100
          item:
            host: 'Keenetic by SNMP'
            key: la.load.15
    - uuid: 90bb1d6e55a3476cb8c5b804a2788c00
      name: 'Memory usage'
      graph_items:
        - color: 1A7C11
          item:
