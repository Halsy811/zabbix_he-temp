            conditions:
              - macro: '{#CPU.TYPE}'
                value: 12356.101.4.4.3.1
                formulaid: A
              - macro: '{#CPU.TYPE}'
                value: 12356.101.4.4.3.2
                formulaid: B
              - macro: '{#CPU.TYPE}'
                value: 12356.101.4.4.3.3
                formulaid: C
