              name: 'CPU Core {#CPU.ID}: Average usage per core'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 199C0D
                  item:
                    host: 'FortiGate 5.6 extended by SNMP'
                    key: 'system.cpu.usage[fgProcessorUsage.{#SNMPINDEX}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'FortiGate 5.6 extended by SNMP'
                    key: 'system.cpu.usage[fgProcessorUserUsage.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: 00611C
                  item:
                    host: 'FortiGate 5.6 extended by SNMP'
                    key: 'system.cpu.usage[fgProcessorSysUsage.{#SNMPINDEX}]'
          master_item:
            key: system.cpu.walk
          preprocessing:
