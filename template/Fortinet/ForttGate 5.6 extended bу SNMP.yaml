        - uuid: 572f0d21b9cc48f0835ab1dd379cfa02
          name: 'VPN tunnel discovery'
          type: DEPENDENT
          key: vpn.tunnel.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VPN.NAME}'
                value: '{$VPN.NAME.MATCHES}'
                formulaid: A
              - macro: '{#VPN.NAME}'
                value: '{$VPN.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Used for discovering VPN tunnels from FORTINET-FORTIGATE-MIB.'
          item_prototypes:
            - uuid: b550847ced47475d9a6c66a61d0edcfb
              name: 'VPN {#VPN.NAME}: Tunnel Status'
              type: DEPENDENT
              key: 'vpn.tunnel.status[fgVpnTunEntStatus.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Current status of tunnel (up or down).
              valuemap:
                name: 'VPN status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.12.2.2.1.20.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: vpn.tunnel.walk
              tags:
                - tag: component
                  value: vpn
                - tag: tunnel
                  value: '{#VPN.NAME}'
              trigger_prototypes:
                - uuid: 1c0797a8b00f439eb3810e12ca7d974a
                  expression: '{$VPN.STATE.CONTROL:"{#VPN.NAME}"}=1 and last(/FortiGate 5.6 extended by SNMP/vpn.tunnel.status[fgVpnTunEntStatus.{#SNMPINDEX}])=1 and (last(/FortiGate 5.6 extended by SNMP/vpn.tunnel.status[fgVpnTunEntStatus.{#SNMPINDEX}],#1)<>last(/FortiGate 5.6 extended by SNMP/vpn.tunnel.status[fgVpnTunEntStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FortiGate 5.6 extended by SNMP/vpn.tunnel.status[fgVpnTunEntStatus.{#SNMPINDEX}])<>1 or {$VPN.STATE.CONTROL:"{#VPN.NAME}"}=0'
                  name: 'FortiGate: VPN {#VPN.NAME}: Tunnel down'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the current tunnel state is down.
                    2. `{$VPN.STATE.CONTROL}=1` - a user can redefine the context macro to "0", marking this notification as not important. No new trigger will be fired if this tunnel is down.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: vpn.tunnel.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#VPN.NAME}'
                - 1.3.6.1.4.1.12356.101.12.2.2.1.3
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: f8a3444dc5f04561be5e8ac906a4e5c4
          name: 'Wireless discovery'
          type: DEPENDENT
          key: wireless.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#WC.NAME}'
                value: '{$WC.NAME.MATCHES}'
