              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/FortiGate 5.6 extended by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and 
                avg(/FortiGate 5.6 extended by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'FortiGate: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
