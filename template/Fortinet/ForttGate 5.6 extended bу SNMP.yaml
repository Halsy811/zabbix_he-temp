        - uuid: d3e8eb4de2e349c99aeabcedf106429a
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            Host accessibility by ICMP.
            0 - ICMP ping failed.
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 828a4e4bc197435c944db3499876262c
              expression: 'max(/FortiGate 5.6 extended by SNMP/icmpping,#3)=0'
              name: 'FortiGate: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 19e5c5121afb4c299fd751468dba55ab
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'Percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 4e2f0110fe79467d89b865ca4e529c6c
              expression: 'min(/FortiGate 5.6 extended by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FortiGate 5.6 extended by SNMP/icmppingloss,5m)<100'
              name: 'FortiGate: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP ping loss detected.'
              dependencies:
                - name: 'FortiGate: Unavailable by ICMP ping'
                  expression: 'max(/FortiGate 5.6 extended by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 3ff17ba8f91a4a4dad06d3e098b1da37
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 5a253dacf9714f97b5ef976b53be04df
              expression: 'avg(/FortiGate 5.6 extended by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'FortiGate: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'FortiGate: High ICMP ping loss'
                  expression: 'min(/FortiGate 5.6 extended by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/FortiGate 5.6 extended by SNMP/icmppingloss,5m)<100'
                - name: 'FortiGate: Unavailable by ICMP ping'
                  expression: 'max(/FortiGate 5.6 extended by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
