zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: e19963aa0ce04b8aa0c8ff8277d7b0b6
      template: 'FortiGate 5.6 extended by SNMP'
      name: 'FortiGate 5.6 extended by SNMP'
      description: |
        Расширенный шаблон на базе официального "FortiGate by SNMP" (Zabbix 7.0-4), адаптирован и проверен на FortiOS 5.6.3 (FortiGate-1000C).
        Добавлено: подписи портов из ifAlias в именах и тегах элементов и графиков, графики пакетов по каждому порту,
        discovery датчиков по типам (температура/вентиляторы/напряжение) с единицами измерения, discovery статистики NPU,
        триггер тревоги сенсора. Удалено: SD-WAN discovery (fgVWLHealthCheck отсутствует в FortiOS 5.6).
        
        MIBs used:
        HOST-RESOURCES-MIB
        FORTINET-FORTIGATE-MIB
        FORTINET-CORE-MIB
        SNMPv2-MIB
        IF-MIB
        
        Generated by official Zabbix template tool "Templator"
        
        tmp:
        {$IFCONTROL} = 0
        {$NET.IF.IFADMINSTATUS.NOT_MATCHES} = CHANGE_IF_NEEDED
        {$NET.IF.IFNAME.NOT_MATCHES} = ^(npu0-vlink[01]|root[01]|int-sys)$
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 8ab6fc4db32e453a92fd441a91a9e714
          name: 'HA config sync'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.13.1.5.0]'
          key: 'ha.auto.sync[fgHaAutoSync.0]'
          delay: 1h
          description: |
            MIB: FORTINET-FORTIGATE-MIB
            Configuration of an automatic configuration synchronization (enabled or disabled).
          valuemap:
            name: 'HA option status'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: ha
        - uuid: 134a835999964742bc6d0e9755e704ae
          name: 'HA cluster group ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12356.101.13.1.2.0]'
          key: 'ha.cluster.group_id[fgHaGroupId.0]'
          delay: 1h
          trends: '0'
          description: |
            MIB: FORTINET-FORTIGATE-MIB
            HA cluster group ID device is configured for.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: ha
        - uuid: 7609037b167e4d9e9f4dd98c68eb0f1d
