                change(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and (
                last(/FortiGate 5.6 extended by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/FortiGate 5.6 extended by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/FortiGate 5.6 extended by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/FortiGate 5.6 extended by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or
