                last(/FortiGate 5.6 extended by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117
                ) and (last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and 
                last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)
              name: 'FortiGate: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'FortiGate: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/FortiGate 5.6 extended by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 0778b6f27d4d4d02905c3edf0bfc3ca4
              expression: |
                (avg(/FortiGate 5.6 extended by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or 
                avg(/FortiGate 5.6 extended by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FortiGate 5.6 extended by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and 
