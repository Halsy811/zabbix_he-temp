                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.3.1.12.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: wireless
            - uuid: e0e411a08d634abab7f95e80e671d698
              name: 'WTP {#WC.NAME}: Base MAC Address'
              type: DEPENDENT
              key: 'wc.base.mac[fgWcWtpSessionWtpBaseMacAddress.{#SNMPINDEX}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the WTP's Base MAC Address, which MAY be assigned to the primary Ethernet interface.
                The instance of the object corresponds to the Base MAC Address sub-element in the CAPWAP protocol [RFC5415].
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.4.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: wireless
            - uuid: c05379e0b6d34c06b4280f0e6538cb37
              name: 'WTP {#WC.NAME}: Bootloader version'
              type: DEPENDENT
              key: 'wc.boot.version[fgWcWtpSessionWtpBootVersion.{#SNMPINDEX}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the boot loader version of a WTP.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.4.1.15.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: wireless
            - uuid: 038e803c8f1a460bbbdd582a5175253f
              name: 'WTP {#WC.NAME}: Connected clients'
              type: DEPENDENT
              key: 'wc.clients.num[fgWcWtpSessionWtpStationCount.{#SNMPINDEX}]'
              delay: '0'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the number of clients currently connected to this WTP.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.4.1.17.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: wireless
            - uuid: f64f1ebd49b0477eb291e4a97568fc08
              name: 'WTP {#WC.NAME}: Connection status'
              type: DEPENDENT
              key: 'wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}]'
              delay: '0'
              trends: '0'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the connection status of a WTP to the AC.
                
                The following enumerated values are supported:
                `offLine(1)` - The WTP is not connected.
                `onLine(2)` - The WTP is connected.
                `downloadingImage(3)` - The WTP is downloading software image from the AC on joining.
                `connectedImage(4)` - The AC is pushing a software image to the connected WTP.
                `other(0)` - The WTP connection status is unknown.
              valuemap:
                name: 'Wireless connection status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.4.1.7.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: wireless
              trigger_prototypes:
                - uuid: 1706dcb8e23243ffbfe4cd0c1b40e391
                  expression: '{$WC.STATE.CONTROL:"{#WC.NAME}"}=1 and last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=1 and (last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#1)<>last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=2 or {$WC.STATE.CONTROL:"{#WC.NAME}"}=0'
                  name: 'FortiGate: WTP {#WC.NAME}: Connection is down'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the current connection status is `offLine`.
                    2. `{$WC.STATE.CONTROL}=1` - a user can redefine the context macro to "0", marking this notification as not important. No new trigger will be fired if this connection is down.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: b272dddc299d4b0e8a976d2b10ca7baf
                  expression: '{$WC.UPDATE.CONTROL:"{#WC.NAME}"}=1 and last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=3 and (last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#1)<>last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=2 or {$WC.UPDATE.CONTROL:"{#WC.NAME}"}=0'
                  name: 'FortiGate: WTP {#WC.NAME}: Receiving firmware update'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the current connection status is `downloadingImage`.
                    2. `{$WC.UPDATE.CONTROL}=1` - a user can redefine the context macro to "0", marking this notification as not important. No new trigger will be fired if the status is `downloadingImage`.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: d716e727bce34bf3a1efc3724af2859d
                  expression: '{$WC.UPDATE.CONTROL:"{#WC.NAME}"}=1 and last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=4 and (last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#1)<>last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FortiGate 5.6 extended by SNMP/wc.conn.status[fgWcWtpSessionConnectionState.{#SNMPINDEX}])=2 or {$WC.UPDATE.CONTROL:"{#WC.NAME}"}=0'
                  name: 'FortiGate: WTP {#WC.NAME}: Sending firmware update'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the current connection status is `connectedImage`.
                    2. `{$WC.UPDATE.CONTROL}=1` - a user can redefine the context macro to "0", marking this notification as not important. No new trigger will be fired if the status is `connectedImage`.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 56360cfcb7284dd894cde1622f42f4f2
              name: 'WTP {#WC.NAME}: CPU usage'
              type: DEPENDENT
              key: 'wc.cpu.usage[fgWcWtpSessionWtpCpuUsage.{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the current CPU usage of a WTP (percentage).
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.12356.101.14.4.4.1.20.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: wireless.ap.walk
              tags:
                - tag: access-point
                  value: '{#WC.NAME}'
                - tag: component
                  value: cpu
                - tag: component
                  value: wireless
              trigger_prototypes:
                - uuid: 481fd8058c444d8ab552fbac6bacedf0
                  expression: 'min(/FortiGate 5.6 extended by SNMP/wc.cpu.usage[fgWcWtpSessionWtpCpuUsage.{#SNMPINDEX}],5m)>{$WC.CPU.UTIL.CRIT:"{#WC.NAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/FortiGate 5.6 extended by SNMP/wc.cpu.usage[fgWcWtpSessionWtpCpuUsage.{#SNMPINDEX}],5m)<{$WC.CPU.UTIL.CRIT:"{#WC.NAME}"}'
                  name: 'FortiGate: WTP {#WC.NAME}: High CPU utilization'
                  event_name: 'FortiGate: WTP {#WC.NAME}: High CPU utilization (over {$WC.CPU.UTIL.CRIT:"{#WC.NAME}"}% for 5m)'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The CPU utilization is too high.'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 9c0471ffa9c94271bac26cabd2729232
              name: 'WTP {#WC.NAME}: Daemon uptime'
              type: DEPENDENT
              key: 'wc.daemon.uptime[fgWcWtpSessionWtpDaemonUpTime.{#SNMPINDEX}]'
              delay: '0'
              units: uptime
              description: |
                MIB: FORTINET-FORTIGATE-MIB
                Represents the time since the WTP daemon has been started.
              preprocessing:
                - type: SNMP_WALK_VALUE
